events {
    worker_connections 1024;
}

http {
    upstream service1 {
        server service1:8000;
    }

    upstream service2 {
        server service2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://service1/;
        }

        location /another/ {
            rewrite ^/another/(.*)$ /$1 break;
            proxy_pass http://service2/;
        }
    }
}